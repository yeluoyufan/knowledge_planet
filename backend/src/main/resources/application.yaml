spring:
  application:
    name: forum
  data:

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/knowledge_planet?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: ForumHikariCP

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

upload:
  path: D:/Code/Java/forum/uploads
  base-url: /uploads

jwt:
  secret: ${JWT_SECRET:CampusForumSecretKeyForJwtSigning2025!!!}
  expiration: ${JWT_EXPIRATION:604800000}

knife4j:
  enable: true
  setting:
    language: zh_cn

server:
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain,text/css,application/javascript,application/xml
